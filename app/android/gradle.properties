org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
# Heap sized for an ~8GB machine (was -Xmx8G which exceeded total RAM and caused
# "Insufficient system resources" build failures). Bump if you move to a bigger box.
org.gradle.daemon=true
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
