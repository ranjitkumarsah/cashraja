# Cash Raja backend on Fly.io (STAGING / validation stack).
# Deploy from this directory:  fly deploy
# Pairs with Neon (Postgres) + Upstash (Redis) — set their URLs as secrets:
#   fly secrets set DATABASE_URL=... REDIS_URL=... JWT_ACCESS_SECRET=... \
#       JWT_REFRESH_SECRET=... JWT_ADMIN_SECRET=... AES_KEY=... \
#       FIREBASE_VERIFIER=firebase FCM_DRIVER=firebase \
#       FIREBASE_SERVICE_ACCOUNT_JSON='...' CORS_ORIGINS=https://<pages-domain>
app = "cashraja-backend"
primary_region = "bom" # Mumbai — closest to the India user base

[build]
  dockerfile = "Dockerfile"

# Run pending migrations once, in a throwaway machine, before the new release
# goes live (the container entrypoint also guards this — idempotent + locked).
[deploy]
  release_command = "npx prisma migrate deploy"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # BullMQ postback worker runs in-process; keep it enabled.
  POSTBACK_WORKER_ENABLED = "true"
  OFFERWALL_NETWORKS = ""
  AD_NETWORKS = ""
  STREAK_REMINDER_ENABLED = "true"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep at least one machine alive: stopping it would kill the BullMQ worker,
  # scheduled jobs (reconciliation, metrics, streak reminders), and the stats
  # cache. Do NOT set auto_stop for a money app with background processing.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/healthz"

# 256MB OOMs under NestJS + Prisma + BullMQ. 512MB is the smallest safe size.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
